{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-4">
        <div class="card mb-4">
            <div class="card-header bg-body-secondary">
                <h5 class="mb-0">Add GCP Account</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('accounts') }}" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Account Name/Alias</label>
                        <input type="text" class="form-control" id="name" name="name" required placeholder="e.g. Personal GCP">
                    </div>
                    <div class="mb-3">
                        <label for="key_file" class="form-label">Service Account JSON Key</label>
                        <input type="file" class="form-control" id="key_file" name="key_file" accept=".json" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Add Account</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-body-secondary">
                <h5 class="mb-0">Manage GCP Accounts</h5>
            </div>
            <div class="card-body p-0">
                <table class="table table-striped mb-0" style="border-radius: 0 0 12px 12px; overflow: hidden;">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Project ID</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for account in accounts %}
                        <tr>
                            <td class="align-middle">{{ account.name }}</td>
                            <td class="align-middle"><code>{{ account.project_id }}</code></td>
                            <td class="text-end">
                                <form method="POST" action="{{ url_for('delete_account', account_id=account.id) }}" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this account?');">
                                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                                </form>
                            </td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="3" class="text-center text-muted py-4">No accounts added yet.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
