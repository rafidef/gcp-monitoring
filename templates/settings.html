{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card mb-4">
            <div class="card-header bg-body-secondary">
                <h5 class="mb-0">System Settings</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('settings') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <h6 class="mb-3 border-bottom pb-2">Notifications</h6>

                    <div class="mb-3">
                        <label for="discord_webhook_url" class="form-label">Discord Webhook URL</label>
                        <input type="url" class="form-control" id="discord_webhook_url" name="discord_webhook_url" value="{{ settings.discord_webhook_url or '' }}">
                        <div class="form-text">Leave blank to disable Discord notifications.</div>
                    </div>

                    <div class="mb-3">
                        <label for="telegram_bot_token" class="form-label">Telegram Bot Token</label>
                        <input type="text" class="form-control" id="telegram_bot_token" name="telegram_bot_token" value="{{ settings.telegram_bot_token or '' }}">
                    </div>

                    <div class="mb-4">
                        <label for="telegram_chat_id" class="form-label">Telegram Chat ID</label>
                        <input type="text" class="form-control" id="telegram_chat_id" name="telegram_chat_id" value="{{ settings.telegram_chat_id or '' }}">
                        <div class="form-text">Both Token and Chat ID are required for Telegram notifications.</div>
                    </div>

                    <h6 class="mb-3 border-bottom pb-2">Security</h6>
                    <div class="mb-4">
                        <label for="new_password" class="form-label">Change Admin Password</label>
                        <input type="password" class="form-control" id="new_password" name="new_password" placeholder="Enter new password to change">
                        <div class="form-text">Leave blank if you do not want to change the password.</div>
                    </div>

                    <button type="submit" class="btn btn-primary">Save Settings</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
