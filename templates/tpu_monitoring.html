{% extends "base.html" %}

{% block title %}Monitoring - {{ tpu_name }}{% endblock %}

{% block content %}
<div class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div class="flex items-center gap-3">
        <a href="{{ url_for('list_tpus_view', account_id=account.id) }}" class="p-2 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 dark:hover:text-indigo-400 dark:hover:bg-indigo-500/10 rounded-lg transition-colors">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div>
            <h2 class="text-2xl font-bold text-slate-800 dark:text-white tracking-tight">Monitoring: {{ tpu_name }}</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">{{ zone }} | {{ account.name }}</p>
        </div>
    </div>

    <div class="flex items-center gap-4">
        <div class="flex items-center gap-2">
            <span class="text-sm text-slate-500 dark:text-slate-400">Auto Refresh</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="autoRefresh" class="sr-only peer" checked>
                <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-indigo-300 dark:peer-focus:ring-indigo-800 rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-slate-600 peer-checked:bg-indigo-600"></div>
            </label>
        </div>
        <select id="timeRange" class="form-select py-2 pl-3 pr-10 bg-white dark:bg-[#1a1a1a] border-slate-300 dark:border-[#333] text-white rounded-md text-sm focus:ring-0 focus:border-[#444] cursor-pointer">
            <option value="1">1 hour</option>
            <option value="6">6 hours</option>
            <option value="24">24 hours</option>
            <option value="168">7 days</option>
        </select>
    </div>
</div>

<div class="grid grid-cols-1 gap-6">
    <!-- CPU Chart Card -->
    <div class="card overflow-hidden bg-[#1e1e1e] border-[#333]">
        <div class="p-4 border-b border-[#333] flex justify-between items-center">
            <div class="relative w-72">
                <select id="cpuToggle" class="form-select appearance-none bg-[#1e1e1e] text-white border border-[#444] rounded text-sm py-1.5 pl-3 pr-8 focus:ring-0 focus:border-[#555] w-full cursor-pointer">
                    <option value="all">CPU utilization (All Workers)</option>
                    <option value="mean">CPU utilization (Mean across all workers)</option>
                    <option value="top4">CPU utilization (Top 4 workers)</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400">
                    <i data-lucide="chevron-down" class="w-4 h-4"></i>
                </div>
            </div>
            <div class="flex items-center gap-3 text-slate-400">
                <i data-lucide="filter" class="w-4 h-4 cursor-pointer hover:text-white"></i>
                <i data-lucide="more-vertical" class="w-4 h-4 cursor-pointer hover:text-white"></i>
            </div>
        </div>
        <div class="p-4 bg-[#141414]">
            <div class="relative h-[250px] w-full">
                <canvas id="cpuChart"></canvas>
            </div>
        </div>
        <div class="border-t border-[#333] bg-[#1a1a1a] p-4 text-sm">
            <table class="w-full text-left" id="cpuLegend">
                <thead class="text-white font-medium">
                    <tr>
                        <th class="pb-2">Name</th>
                        <th class="pb-2 text-right">Value</th>
                    </tr>
                </thead>
                <tbody class="text-slate-300 space-y-2">
                    <!-- Legend rows inserted by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Memory Chart Card -->
    <div class="card overflow-hidden bg-[#1e1e1e] border-[#333]">
        <div class="p-4 border-b border-[#333] flex justify-between items-center">
            <div class="relative w-72">
                <select id="memoryToggle" class="form-select appearance-none bg-[#1e1e1e] text-white border border-[#444] rounded text-sm py-1.5 pl-3 pr-8 focus:ring-0 focus:border-[#555] w-full cursor-pointer">
                    <option value="all">Memory usage (All Workers)</option>
                    <option value="mean">Memory usage (Mean across all workers)</option>
                    <option value="top4">Memory usage (Top 4 workers)</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400">
                    <i data-lucide="chevron-down" class="w-4 h-4"></i>
                </div>
            </div>
            <div class="flex items-center gap-3 text-slate-400">
                <i data-lucide="filter" class="w-4 h-4 cursor-pointer hover:text-white"></i>
                <i data-lucide="more-vertical" class="w-4 h-4 cursor-pointer hover:text-white"></i>
            </div>
        </div>
        <div class="p-4 bg-[#141414]">
            <div class="relative h-[250px] w-full">
                <canvas id="memoryChart"></canvas>
            </div>
        </div>
        <div class="border-t border-[#333] bg-[#1a1a1a] p-4 text-sm">
            <table class="w-full text-left" id="memoryLegend">
                <thead class="text-white font-medium">
                    <tr>
                        <th class="pb-2">Name</th>
                        <th class="pb-2 text-right">Value</th>
                    </tr>
                </thead>
                <tbody class="text-slate-300 space-y-2">
                    <!-- Legend rows inserted by JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        lucide.createIcons();

        // Chart color palette matching standard GCP monitoring
        const colors = [
            '#a855f7', // purple
            '#06b6d4', // cyan
            '#8b5cf6', // violet
            '#3b82f6', // blue
            '#22c55e', // green
            '#f97316', // orange
            '#ef4444', // red
            '#eab308'  // yellow
        ];

        const chartOptions = {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            interaction: {
                mode: 'index',
                intersect: false,
            },
            plugins: {
                legend: {
                    display: false // We will build a custom HTML legend below the chart
                },
                tooltip: {
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    titleColor: '#fff',
                    bodyColor: '#ccc',
                    borderColor: '#333',
                    borderWidth: 1,
                }
            },
            scales: {
                x: {
                    type: 'time',
                    time: {
                        unit: 'minute'
                    },
                    grid: {
                        display: false,
                        drawBorder: true,
                        borderColor: '#555'
                    },
                    ticks: {
                        color: '#888',
                        maxRotation: 0,
                        autoSkip: true,
                        maxTicksLimit: 8
                    }
                },
                y: {
                    grid: {
                        color: '#333',
                        drawBorder: false,
                    },
                    ticks: {
                        color: '#888'
                    },
                    position: 'right'
                }
            }
        };

        const cpuCtx = document.getElementById('cpuChart').getContext('2d');
        const cpuChart = new Chart(cpuCtx, {
            type: 'line',
            data: { datasets: [] },
            options: {
                ...chartOptions,
                plugins: {
                    ...chartOptions.plugins,
                    tooltip: {
                        ...chartOptions.plugins.tooltip,
                        callbacks: {
                            label: function(context) {
                                let label = context.dataset.label || '';
                                if (label) {
                                    label += ': ';
                                }
                                if (context.parsed.y !== null) {
                                    label += (context.parsed.y * 100).toFixed(2) + '%';
                                }
                                return label;
                            }
                        }
                    }
                },
                scales: {
                    ...chartOptions.scales,
                    y: {
                        ...chartOptions.scales.y,
                        ticks: {
                            color: '#888',
                            callback: function(value) {
                                return (value * 100).toFixed(0) + '%';
                            }
                        }
                    }
                }
            }
        });

        const memCtx = document.getElementById('memoryChart').getContext('2d');
        const memChart = new Chart(memCtx, {
            type: 'line',
            data: { datasets: [] },
            options: {
                ...chartOptions,
                plugins: {
                    ...chartOptions.plugins,
                    tooltip: {
                        ...chartOptions.plugins.tooltip,
                        callbacks: {
                            label: function(context) {
                                let label = context.dataset.label || '';
                                if (label) {
                                    label += ': ';
                                }
                                if (context.parsed.y !== null) {
                                    label += (context.parsed.y / (1024*1024*1024)).toFixed(3) + ' GiB';
                                }
                                return label;
                            }
                        }
                    }
                },
                scales: {
                    ...chartOptions.scales,
                    y: {
                        ...chartOptions.scales.y,
                        ticks: {
                            color: '#888',
                            callback: function(value) {
                                return (value / (1024*1024*1024)).toFixed(0) + ' GiB';
                            }
                        }
                    }
                }
            }
        });

        function updateLegend(chartId, datasets) {
            const tbody = document.querySelector(`#${chartId}Legend tbody`);
            tbody.innerHTML = '';

            datasets.forEach(ds => {
                const tr = document.createElement('tr');
                const lastVal = ds.data.length > 0 ? ds.data[ds.data.length - 1].y : 0;
                let formattedVal = lastVal;

                if (chartId === 'cpu') {
                    formattedVal = (lastVal * 100).toFixed(2) + '%';
                } else if (chartId === 'memory') {
                    formattedVal = (lastVal / (1024*1024*1024)).toFixed(3) + 'GiB';
                }

                tr.innerHTML = `
                    <td class="py-2 flex items-center gap-3">
                        <span class="w-3 h-3 rounded-full" style="background-color: ${ds.borderColor}"></span>
                        Worker ${ds.label}
                    </td>
                    <td class="py-2 text-right font-mono">${formattedVal}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function fetchMetrics() {
            const hours = document.getElementById('timeRange').value;
            try {
                const response = await fetch(`/api/tpu/{{ account.id }}/{{ zone }}/{{ tpu_name }}/metrics?hours=${hours}`);
                const data = await response.json();

                // Process CPU
                const cpuDatasets = data.cpu.map((series, idx) => {
                    return {
                        label: series.worker_id,
                        data: series.points.map(p => ({ x: p.timestamp * 1000, y: p.value })),
                        borderColor: colors[idx % colors.length],
                        backgroundColor: 'transparent',
                        borderWidth: 1.5,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        tension: 0.1
                    };
                });
                cpuChart.data.datasets = cpuDatasets;
                cpuChart.update();
                updateLegend('cpu', cpuDatasets);

                // Process Memory
                const memDatasets = data.memory.map((series, idx) => {
                    return {
                        label: series.worker_id,
                        data: series.points.map(p => ({ x: p.timestamp * 1000, y: p.value })),
                        borderColor: colors[idx % colors.length],
                        backgroundColor: 'transparent',
                        borderWidth: 1.5,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        tension: 0.1
                    };
                });
                memChart.data.datasets = memDatasets;
                memChart.update();
                updateLegend('memory', memDatasets);

            } catch (err) {
                console.error("Failed to fetch metrics", err);
            }
        }

        // Initial fetch
        fetchMetrics();

        // Auto Refresh logic
        let rawCpuData = [];
        let rawMemoryData = [];

        function processDatasets(data, toggleValue) {
            let processed = [...data];

            if (toggleValue === 'top4') {
                // Sort by last value descending, take top 4
                processed.sort((a, b) => {
                    const lastA = a.points.length > 0 ? a.points[a.points.length - 1].value : 0;
                    const lastB = b.points.length > 0 ? b.points[b.points.length - 1].value : 0;
                    return lastB - lastA;
                });
                processed = processed.slice(0, 4);
            } else if (toggleValue === 'mean') {
                if (processed.length > 0) {
                    const timeMap = new Map();
                    processed.forEach(series => {
                        series.points.forEach(p => {
                            if (!timeMap.has(p.timestamp)) {
                                timeMap.set(p.timestamp, []);
                            }
                            timeMap.get(p.timestamp).push(p.value);
                        });
                    });

                    const meanPoints = Array.from(timeMap.entries())
                        .map(([ts, vals]) => {
                            const sum = vals.reduce((a, b) => a + b, 0);
                            return { timestamp: ts, value: sum / vals.length };
                        })
                        .sort((a, b) => a.timestamp - b.timestamp);

                    processed = [{
                        worker_id: 'Mean',
                        points: meanPoints
                    }];
                }
            }

            return processed;
        }

        function renderCpuChart() {
            const toggleVal = document.getElementById('cpuToggle').value;
            const processed = processDatasets(rawCpuData, toggleVal);

            const cpuDatasets = processed.map((series, idx) => {
                return {
                    label: series.worker_id,
                    data: series.points.map(p => ({ x: p.timestamp * 1000, y: p.value })),
                    borderColor: colors[idx % colors.length],
                    backgroundColor: 'transparent',
                    borderWidth: 1.5,
                    pointRadius: 0,
                    pointHoverRadius: 4,
                    tension: 0.1
                };
            });
            cpuChart.data.datasets = cpuDatasets;
            cpuChart.update();
            updateLegend('cpu', cpuDatasets);
        }

        function renderMemoryChart() {
            const toggleVal = document.getElementById('memoryToggle').value;
            const processed = processDatasets(rawMemoryData, toggleVal);

            const memDatasets = processed.map((series, idx) => {
                return {
                    label: series.worker_id,
                    data: series.points.map(p => ({ x: p.timestamp * 1000, y: p.value })),
                    borderColor: colors[idx % colors.length],
                    backgroundColor: 'transparent',
                    borderWidth: 1.5,
                    pointRadius: 0,
                    pointHoverRadius: 4,
                    tension: 0.1
                };
            });
            memChart.data.datasets = memDatasets;
            memChart.update();
            updateLegend('memory', memDatasets);
        }

        async function fetchMetrics() {
            const hours = document.getElementById('timeRange').value;
            try {
                const response = await fetch(`/api/tpu/{{ account.id }}/{{ zone }}/{{ tpu_name }}/metrics?hours=${hours}`);
                const data = await response.json();

                rawCpuData = data.cpu;
                rawMemoryData = data.memory;

                renderCpuChart();
                renderMemoryChart();
            } catch (err) {
                console.error("Failed to fetch metrics", err);
            }
        }

        document.getElementById('cpuToggle').addEventListener('change', renderCpuChart);
        document.getElementById('memoryToggle').addEventListener('change', renderMemoryChart);

        let refreshInterval = setInterval(fetchMetrics, 30000);

        document.getElementById('autoRefresh').addEventListener('change', (e) => {
            if (e.target.checked) {
                refreshInterval = setInterval(fetchMetrics, 30000);
            } else {
                clearInterval(refreshInterval);
            }
        });

        document.getElementById('timeRange').addEventListener('change', () => {
            fetchMetrics();
        });
    });
</script>
{% endblock %}
